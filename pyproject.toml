[project]
name = "trove-setup"

description = "Simple TUI for setting up trove classifiers"
authors = [{ name = "Jan Vollmer", email = "jan@vllmr.dev" }]
dependencies = [
  "textual>=8.2.8",
  "trove-classifiers>=2026.9.21.13",
  "typer>=0.27.3",
  "tomlkit>=0.15.2",
  "jmespath>=1.1.0",
  "rich>=15.0.0",
  "packaging>=26.3",
]
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
keywords = ["trove", "classifier", "pypi", "package"]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/jvllmr/trove-setup"

[project.scripts]
trove_setup = "trove_setup.cli:run_typer"
trove-setup = "trove_setup.cli:run_typer"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src/trove_setup"]

[tool.ty.rules]
dynamic-function-decorator-return = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsound-return-statement = "error"

[tool.pdm]
plugins = ["sync-pre-commit-lock"]

[tool.pdm.version]
source = "scm"

[tool.pdm.scripts]
dev = "textual run trove_setup.app:TroveSetupApp --dev"
console = "textual console"
test = "pytest -x -n auto"
update-snapshots = "pytest -x -n auto --snapshot-update"

[tool.ruff.lint]
extend-select = ["F", "I"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
  "ruff>=0.17.3",
  "pytest>=8.4.2",
  "nox>=2026.10.20",
  "textual-dev>=1.8.0",
  "pytest-textual-snapshot>=1.1.0",
  "types-jmespath>=1.1.0.20260724",
  "pytest-xdist>=3.8.0",
  "pytest-asyncio>=1.4.1",
  "prek>=0.5.9",
  "ty>=0.0.95",
]
